<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#152d2c" />
    <meta
      name="description"
      content="Tiệm Trà Mơ — một ca tối nhỏ, một giấc mơ lớn. Game phục vụ quán trà Việt Nam."
    />
    <title>Tiệm Trà Mơ · Một ca tối nhỏ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b3935'/%3E%3Cpath d='M17 18h30l-4 34H21z' fill='%23edbd7c'/%3E%3Cpath d='M15 16h34v6H15zM34 5h5v15h-5z' fill='%23f5ead5'/%3E%3Ccircle cx='27' cy='44' r='3' fill='%2353372c'/%3E%3Ccircle cx='37' cy='45' r='3' fill='%2353372c'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <a class="brand" href="./" aria-label="Tiệm Trà Mơ"
          ><span class="brand-cup">♧</span
          ><span
            >tiệm trà <strong>mơ</strong
            ><small>EST. 2026 · SÀI GÒN</small></span
          ></a
        >
        <div class="header-note">
          <span class="live-dot"></span> MỘT CA TỐI NHỎ, MỘT GIẤC MƠ LỚN
        </div>
        <button
          id="sound-toggle"
          class="sound-button"
          aria-label="Bật âm thanh"
          title="Bật / tắt âm thanh"
        >
          ♫ <span>Âm thanh: tắt</span>
        </button>
      </header>
      <main>
        <div class="game-heading">
          <span>CHƠI MỘT CHÚT, MƠ MỘT CHÚT</span
          ><span class="edition">BẢN CHƠI ĐẦU TIÊN <i>01</i></span>
        </div>
        <div
          id="game"
          aria-label="Game Tiệm Trà Mơ. Dùng A và D di chuyển, E tương tác."
          tabindex="0"
        ></div>
      </main>
      <footer>
        <div class="keys">
          <span><kbd>A</kbd><kbd>D</kbd> Di chuyển</span
          ><span><kbd>Shift</kbd> Chạy</span><span><kbd>E</kbd> Tương tác</span
          ><span><kbd>Tab</kbd> Đơn hàng</span
          ><span><kbd>Esc</kbd> Tạm dừng</span>
        </div>
        <span class="footer-note"
          >Pha bằng tay. Phục vụ bằng cả trái tim. <span>✦</span></span
        >
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
